<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121314">
<title>Home Collection</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=3">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=3">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Collection">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/vendor/supabase-2.45.4.js"></script>
<script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');</script>
<style>
:root{
  --bg:#121314; --s1:#18191b; --s2:#1f2023; --s3:#26282b;
  --line:#2b2d30; --line2:#3a3c40;
  --fg:#f5f5f6; --fg2:#a9abb0; --fg3:#74767c;
  --danger:#f2786f; --ok:#9ad0a6; --warn:#e6c27a;
  --r:12px; --r-sm:8px;
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --t-fast:120ms; --t-med:220ms;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
#view:focus,#view:focus-visible{outline:none}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(18,19,20,.96);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:0 24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:28px;height:28px;border-radius:7px}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;flex:1;min-width:0}
.tab{padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--fg2);font-weight:500;font-size:14px;white-space:nowrap;transition:color var(--t-fast),background var(--t-fast)}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{background:var(--fg);color:var(--bg)}
.tab .n{font-family:var(--mono);font-size:12px;opacity:.6;margin-left:6px}
.acct{display:flex;align-items:center;gap:8px;flex-shrink:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg3)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--fg3)}
.live[data-s="live"] i{background:var(--ok)}
.live[data-s="offline"] i{background:var(--warn)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:background var(--t-fast),border-color var(--t-fast)}
.btn:hover{background:var(--s3)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.primary:hover{background:#dcdcde}
.btn.danger{border-color:#5a2f2c;color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#1a0d0c;border-color:var(--danger)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line2);background:transparent;display:inline-grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--s3)}
.iconbtn svg{width:18px;height:18px}

/* layout */
main{max-width:1240px;margin:0 auto;padding:40px 24px 96px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:500;margin:0 0 6px}
h1{font-size:40px;line-height:1.05;letter-spacing:-.035em;font-weight:600;margin:0}
h2{font-size:18px;letter-spacing:-.015em;font-weight:600;margin:0 0 14px}
.sub{color:var(--fg2);margin:8px 0 0}
.hint{color:var(--fg3);font-size:13px}

/* vehicle grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{display:block;text-decoration:none;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color var(--t-med),transform var(--t-med) var(--ease)}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.ph{aspect-ratio:16/10;background:var(--s2);position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .mk{position:absolute;inset:0;display:grid;place-items:center;color:var(--line2);font-weight:700;font-size:56px;letter-spacing:-.05em;user-select:none}
.ph .st{position:absolute;top:12px;left:12px}
.card .body{padding:16px 18px 18px}
.card .yr{font-family:var(--mono);font-size:12px;color:var(--fg3)}
.card .nm{font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:2px 0 0}
.card .nick{color:var(--fg2);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.facts dt{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
.facts dd{margin:2px 0 0;font-family:var(--mono);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500;background:var(--s3);color:var(--fg2);border:1px solid var(--line2);white-space:nowrap}
.chip.light{background:rgba(18,19,20,.8);color:var(--fg);border-color:rgba(255,255,255,.12)}

/* empty */
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:56px 24px;text-align:center}
.empty h2{margin:0 0 6px}
.empty p{color:var(--fg2);margin:0 0 20px}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg2);text-decoration:none;font-size:14px;margin-bottom:20px}
.back:hover{color:var(--fg)}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:start}
.hero .ph{border-radius:var(--r);border:1px solid var(--line)}
.hero h1{font-size:44px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:24px}
.stats div{background:var(--s1);padding:14px 16px}
.stats dt{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
.stats dd{margin:4px 0 0;font-family:var(--mono);font-size:18px;letter-spacing:-.02em}
.stats dd small{font-size:12px;color:var(--fg3)}
.section{margin-top:48px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.section-head h2{margin:0}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;border-top:1px solid var(--line)}
.spec div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;margin-right:24px}
.spec dt{color:var(--fg3);font-size:14px}
.spec dd{margin:0;text-align:right;font-size:14px;overflow-wrap:anywhere}
.notes{color:var(--fg2);white-space:pre-wrap;margin:0;max-width:72ch}

/* ledger */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filters .fld{margin:0;min-width:150px;flex:1 1 150px}
.filters .fld.grow{flex:2 1 220px}
.summary{display:flex;gap:24px;flex-wrap:wrap;color:var(--fg2);font-size:14px;margin:0 0 12px}
.summary b{color:var(--fg);font-family:var(--mono);font-weight:500}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 110px 120px;gap:16px;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;border-radius:0}
.row:hover{background:var(--s1)}
.row .d{font-family:var(--mono);font-size:13px;color:var(--fg2)}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:13px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mi{font-family:var(--mono);font-size:13px;color:var(--fg2);text-align:right}
.row .a{font-family:var(--mono);text-align:right}

/* costs table */
.tbl-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);font-weight:500;background:var(--s1)}
td.n,th.n{text-align:right;font-family:var(--mono)}
tfoot td{font-weight:600;background:var(--s1);border-bottom:0}
tbody tr:hover td{background:var(--s1)}
td a{text-decoration:none}
td a:hover{text-decoration:underline}

/* panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity var(--t-med);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--s1);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform var(--t-med) var(--ease);display:flex;flex-direction:column;visibility:hidden}
.panel.on{transform:none;visibility:visible}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:18px}
.panel-b{padding:22px;overflow-y:auto;flex:1}
.panel-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.panel-f .sp{flex:1}

/* forms */
fieldset{border:0;padding:0;margin:0 0 24px}
legend{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:500;margin-bottom:12px;padding:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:13px;color:var(--fg2);font-weight:500}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 12px;min-height:40px;width:100%;transition:border-color var(--t-fast)}
.fld textarea{min-height:88px;resize:vertical}
.fld input:hover,.fld select:hover,.fld textarea:hover{border-color:#4a4c51}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--fg)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--danger)}
.fld .err{color:var(--danger);font-size:12.5px;min-height:0}
.fld .help{color:var(--fg3);font-size:12.5px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg2);margin:-4px 0 14px}
.check input{width:16px;height:16px;accent-color:var(--fg)}
.form-err{background:#2a1716;border:1px solid #5a2f2c;color:#f4c1bc;border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;margin-bottom:16px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:3px;margin-bottom:20px}
.seg button{flex:1;height:32px;border:0;background:none;border-radius:999px;cursor:pointer;color:var(--fg2);font-weight:500;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.thumb{width:100%;aspect-ratio:16/10;border-radius:var(--r-sm);background:var(--s2);object-fit:cover;display:block;margin-bottom:8px;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 16px;margin:0 0 20px}
.kv dt{color:var(--fg3);font-size:14px}
.kv dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.confirm{background:#231514;border:1px solid #5a2f2c;border-radius:var(--r-sm);padding:14px;margin-top:8px}
.confirm p{margin:0 0 12px;font-size:14px}

.lock{display:inline-flex;align-items:center;gap:6px;color:var(--fg3);font-size:13px}
.banner{background:#2a2414;border:1px solid #574a26;color:#eedcae;border-radius:var(--r-sm);padding:10px 14px;font-size:13.5px;margin-bottom:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity var(--t-med),transform var(--t-med) var(--ease);z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#1a0d0c}
.skel{background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}

/* dashboard */
:root{--bar:#c4c5c9}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0 0 44px}
.kpis>div{background:var(--s1);padding:18px 20px 20px;min-width:0}
.kpis dt{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em}
.kpis dd{margin:8px 0 0;font-family:var(--mono);font-size:26px;letter-spacing:-.03em;line-height:1.2;overflow-wrap:anywhere}
.kpis dd.sm{font-size:20px}
.kpis small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--fg3);margin-top:8px;letter-spacing:0;line-height:1.4}
.garage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.garage-head h2{margin:0}
.seg.sm{margin:0;padding:2px;display:inline-flex}
.seg.sm button{height:28px;padding:0 12px;font-size:12.5px;flex:none}
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:24px 18px;margin-bottom:52px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;min-width:0}
.app .ic{width:100%;aspect-ratio:1;border-radius:24%;overflow:hidden;background:var(--s2);border:1px solid var(--line);position:relative;transition:transform var(--t-med) var(--ease),border-color var(--t-med)}
.app .ic img{width:100%;height:100%;object-fit:cover;display:block}
.app .ic .mk{position:absolute;inset:0;display:grid;place-items:center;color:var(--line2);font-weight:700;font-size:30px;letter-spacing:-.04em}
.app:hover .ic{transform:translateY(-2px);border-color:#4a4c51}
.app .lb{font-size:12.5px;font-weight:500;text-align:center;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .lb2{font-size:11px;color:var(--fg3);font-family:var(--mono);margin-top:-6px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 20px;min-width:0}
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.cc-h h3{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.cc-h p{margin:3px 0 0;font-size:12.5px;color:var(--fg3)}
.cc .tools{display:flex;gap:6px;flex-shrink:0;align-items:center}
.cc .tbl{display:none}
.cc.as-table .tbl{display:block}
.cc.as-table .viz{display:none}
.cc .tbl table{min-width:0}
.cc .tbl td,.cc .tbl th{padding:8px 10px;font-size:13px}
.cc .none{color:var(--fg3);font-size:13.5px;margin:8px 0}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 0;text-decoration:none}
.hb .l{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.hb .tr{height:12px;display:block}
.hb .b{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px;transition:background var(--t-fast)}
.hb .v{font-family:var(--mono);font-size:12.5px}
.hb:hover .b{background:var(--fg)}
.hb:hover .l{color:var(--fg)}
.vb{position:relative;height:170px;display:flex;align-items:flex-end;gap:2px;margin-left:48px}
.vb .g{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.vb .g span{position:absolute;right:calc(100% + 8px);top:-8px;white-space:nowrap;font-size:11px;color:var(--fg3);font-family:var(--mono)}
.vb .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:1;cursor:default}
.vb .bar{width:min(70%,34px);background:var(--bar);border-radius:4px 4px 0 0;transition:background var(--t-fast)}
.vb .col:hover .bar{background:var(--fg)}
.vx{display:flex;gap:2px;margin:8px 0 0 48px}
.vx span{flex:1;text-align:center;font-size:11px;color:var(--fg3);font-family:var(--mono);overflow:hidden;white-space:nowrap}
.lc{position:relative;height:210px;margin-left:56px}
.lc svg{position:absolute;inset:0 0 24px 0;width:100%;height:calc(100% - 24px);overflow:visible}
.lc .g{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.lc .g span{position:absolute;right:calc(100% + 8px);top:-8px;white-space:nowrap;font-size:11px;color:var(--fg3);font-family:var(--mono)}
.lc .xl{position:absolute;bottom:0;font-size:11px;color:var(--fg3);font-family:var(--mono);transform:translateX(-50%);white-space:nowrap}
.lc .xl.first{transform:none}.lc .xl.last{transform:translateX(-100%)}
.lc .xh{position:absolute;top:0;bottom:24px;width:1px;background:var(--line2);display:none;pointer-events:none}
.lc .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 2px var(--s1);transform:translate(-50%,-50%);display:none;pointer-events:none}
.lc .hit{position:absolute;inset:0 0 24px 0;cursor:crosshair}
.list{border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:center}
.li:hover .t{text-decoration:underline}
.li .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{font-size:12.5px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .r{font-family:var(--mono);font-size:12.5px;color:var(--fg2);text-align:right}
#tip{position:fixed;z-index:70;background:var(--s3);border:1px solid var(--line2);color:var(--fg);padding:8px 10px;border-radius:var(--r-sm);font-size:12.5px;line-height:1.4;pointer-events:none;opacity:0;transition:opacity var(--t-fast);max-width:260px;white-space:pre-line;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tip.on{opacity:1}
.vcharts{margin-top:48px}
.rowbtn{cursor:pointer}
@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:24px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .charts{grid-template-columns:1fr}
}
@media (max-width:720px){
  .kpis dd{font-size:20px}.kpis dd.sm{font-size:16px}

<script>
/* ---------- config ---------- */
// The database is reached through this site's own address (/sb, a Vercel rewrite), so networks or
// browser extensions that block supabase.co don't stop the page. Local previews talk to it directly.
const SUPA_DIRECT = 'https://ftettbbdgivkbamonywf.supabase.co';
const SUPA_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:' ? SUPA_DIRECT : location.origin + '/sb';
const SUPA_KEY = 'sb_publishable_9jiNbL4oGDjaXOEstTlmzQ_ulmZMw2J';

const CATEGORIES = {
  maintenance:'Maintenance', repair:'Repair', restoration:'Restoration', modification:'Modification', parts:'Parts',
  tyres:'Tyres', detailing:'Detailing', inspection:'Inspection', registration:'Registration',
  insurance:'Insurance', other:'Other'
};
const CONFIDENCE = { printed:'Printed invoice', hand:'Handwritten (best read)', est:'Estimated', report:'Report only, no invoice', cf:'Carfax', log:"Owner's records" };
const CURRENCIES = { USD:'US dollars (US$)', BRL:'Brazilian reais (R$)' };
const METERS = { distance:'Odometer', hours:'Hour meter', both:'Odometer and hour meter' };
const STATUS = { owned:'Owned', project:'Project', stored:'Stored', sold:'Sold' };

/* ---------- state ---------- */
let db = null;
try { db = window.supabase.createClient(SUPA_URL, SUPA_KEY); } catch (e) { db = null; }
const S = { vehicles: [], records: [], readings: [], user: null, editor: false };
window.live = { state: 'loading', counts: {} };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FMT = {};
const fmtFor = (cur, d) => FMT[cur + d] || (FMT[cur + d] = new Intl.NumberFormat('en-US', { style:'currency', currency:cur, currencyDisplay:'symbol', minimumFractionDigits: d ? 2 : 0, maximumFractionDigits: d ? 2 : 0 }));
const money = (v, d, cur = 'USD') => v == null || v === '' ? '—' : fmtFor(cur || 'USD', !!d).format(+v).replace(/^\$/, 'US$');
// sums kept per currency, never converted
const sumBy = (rows, amt = r => r.amount, cur = r => r.currency) => rows.reduce((m, r) => { const a = +amt(r) || 0; if (a) m[cur(r) || 'USD'] = (m[cur(r) || 'USD'] || 0) + a; return m; }, {});
const addSums = (...ms) => ms.reduce((o, m) => { for (const k in m) o[k] = (o[k] || 0) + m[k]; return o; }, {});
const msum = (m, d) => { const ks = ['BRL', 'USD'].filter(k => m[k]); return ks.length ? ks.map(k => money(m[k], d, k)).join(' + ') : '—'; };
const num = v => v == null || v === '' ? '—' : (+v).toLocaleString('en-US');
const fdate = d => { if (!d) return '—'; const [y,m,dd] = d.split('-'); return `${m}/${dd}/${y}`; };
const vname = v => v ? [v.year, v.make, v.model, v.colour && S.vehicles.filter(x => x.make === v.make && x.model === v.model).length > 1 ? '(' + v.colour + ')' : ''].filter(Boolean).join(' ') : 'Unknown vehicle';
const vshort = v => v ? [v.make, v.model].filter(Boolean).join(' ') : '—';
const readingStr = (odo, unit, hrs) => [odo != null ? num(odo) + ' ' + unit : '', hrs != null ? (+hrs).toLocaleString('en-US') + ' h' : ''].filter(Boolean).join(' · ') || '—';
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || (a.date ? 0 : 0);
const sortRecs = list => list.sort((a, b) => (!a.date) - (!b.date) || (b.date || '').localeCompare(a.date || ''));
const vById = id => S.vehicles.find(v => v.id === id);
const recsFor = id => S.records.filter(r => r.vehicle_id === id);
const spent = id => sumBy(recsFor(id));
const paid = v => v.purchase_price ? { [v.currency || 'USD']: +v.purchase_price } : {};
const readsFor = id => S.readings.filter(r => r.vehicle_id === id);
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  lock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>'
};
const lockNote = () => `<span class="lock">${ICON.lock}Sign in to edit</span>`;

function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2800);
}

/* ---------- data ---------- */
async function load() {
  if (!db) { await useSnapshot('the database library didn\'t load'); return; }
  try {
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), 10000));
    const [v, r, o] = await Promise.race([timeout, Promise.all([
      db.from('vehicles').select('*').order('sort_order').order('year', { ascending: false }),
      db.from('service_records').select('*').order('date', { ascending: false, nullsFirst: false }),
      db.from('odometer_readings').select('*').order('date', { ascending: false, nullsFirst: false })
    ])]);
    const err = v.error || r.error || o.error;
    if (err && !load.retried && /jwt|token|401|PGRST30/i.test((err.code || '') + ' ' + (err.message || ''))) {
      load.retried = true; console.warn('Stored sign-in rejected; signing out on this device', err);
      await db.auth.signOut({ scope: 'local' }).catch(() => {}); toast('Your sign-in expired. Please sign in again.', true); return load();
    }
    if (err) throw err;
    S.vehicles = v.data; S.records = sortRecs(r.data); S.readings = o.data; S.offline = null;
    try { localStorage.setItem('hc-cache', JSON.stringify({ saved: new Date().toISOString().slice(0, 10), vehicles: v.data, records: r.data, readings: o.data })); } catch (e) {}
    setLive('live');
  } catch (e) { console.warn('Database unreachable, showing saved copy', e); await useSnapshot(/timed out/.test(e.message || '') ? 'the database didn\'t answer' : 'the database couldn\'t be reached'); return; }
  render();
}
async function useSnapshot(reason) {
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem('hc-cache') || 'null'); } catch (e) {}
  if (!snap) { try { snap = await (await fetch('/data/snapshot.json', { cache: 'no-store' })).json(); } catch (e) {} }
  snap = snap || { vehicles: [], records: [], readings: [] };
  S.vehicles = snap.vehicles || []; S.records = sortRecs(snap.records || []); S.readings = snap.readings || [];
  S.offline = { reason, saved: snap.saved };
  setLive('offline'); render();
}
function setLive(s) {
  window.live.state = s;
  window.live.counts = { vehicles: S.vehicles.length, records: S.records.length, readings: S.readings.length };
  $('#live').dataset.s = s;
  $('#live-t').textContent = s === 'live' ? 'Live' : s === 'offline' ? 'Offline copy' : 'Connecting';
}

/* ---------- auth ---------- */
async function refreshAuth(session) {
  if (!db) return;
  if (session === undefined) session = (await db.auth.getSession()).data.session;
  S.user = session?.user || null;
  S.editor = false;
  if (S.user) {
    const { data: ed } = await db.from('editors').select('email').eq('email', (S.user.email || '').toLowerCase());
    S.editor = !!(ed && ed.length);
  }
  $('#acct-btn').textContent = S.user ? (S.editor ? 'Editing' : 'Signed in') : 'Sign in';
  render();
}
function authMsg(err) {
  const m = (err && (err.message || err.error_description || String(err))) || '';
  if (/invalid login credentials/i.test(m)) return 'That email and password don\'t match. Check both, or choose Create password if this is your first visit.';
  if (/signups? not allowed/i.test(m)) return 'Sign-ups are switched off for this project. In Supabase, go to Authentication → Sign In / Providers → User Signups and turn on "Allow new users to sign up".';
  if (/rate limit/i.test(m)) return '"Confirm email" is still on. In Supabase, go to Authentication → Sign In / Providers and turn off "Confirm email", then try again.';
  if (/database error saving new user/i.test(m)) return 'This email isn\'t on the editor list for this collection. Ask the owner to add it, then try again.';
  if (/already registered/i.test(m)) return 'This email already has a password. Switch to Sign in.';
  if (/email not confirmed/i.test(m)) return 'This account is waiting on an email confirmation. Turn off "Confirm email" in Supabase (Authentication → Sign In / Providers), delete this user under Authentication → Users, then create the password again.';
  if (/password should be at least/i.test(m)) return 'Use at least 6 characters for the password.';
  if (/failed to fetch|network/i.test(m)) return 'Couldn\'t reach the database. Check your connection and try again.';
  return m || 'Something went wrong. Try again.';
}
function openAccount() {
  if (S.user) {
    openPanel('Account', `
      <dl class="kv"><dt>Email</dt><dd>${esc(S.user.email)}</dd>
      <dt>Access</dt><dd>${S.editor ? 'Editor — you can add and change records' : 'View only — this email isn\'t on the editor list'}</dd></dl>
      <form id="pw-form" novalidate>
        <fieldset><legend>Set a new password</legend>
          ${field('pw', 'New password', 'password', '', { required:true, help:'At least 6 characters.', ac:'new-password' })}
        </fieldset>
        <button class="btn" type="submit">Save password</button>
      </form>`,
      `<span class="sp"></span><button class="btn" type="button" id="so">Sign out</button>`);
    wireForm('#pw-form', { pw: v => v.length < 6 ? 'Use at least 6 characters.' : '' }, async vals => {
      const { error } = await db.auth.updateUser({ password: vals.pw });
      if (error) throw new Error(authMsg(error));
      toast('Password saved'); closePanel();
    });
    $('#so').onclick = async () => { await db.auth.signOut(); closePanel(); toast('Signed out'); refreshAuth(); };
    return;
  }
  let mode = 'in';
  const draw = () => {
    openPanel(mode === 'in' ? 'Sign in' : 'Create password', `
      <div class="seg" role="group" aria-label="Sign-in mode">
        <button type="button" data-m="in" aria-pressed="${mode==='in'}">Sign in</button>
        <button type="button" data-m="up" aria-pressed="${mode==='up'}">Create password</button>
      </div>
      <p class="hint" style="margin:0 0 18px">${mode==='in' ? 'Editors sign in to add and change vehicles and service records. Anyone with the link can view.' : 'First visit? Choose a password for your editor email.'}</p>
      <form id="auth-form" novalidate>
        ${field('email', 'Email', 'email', '', { required:true, ac:'email' })}
        ${field('pw', 'Password', 'password', '', { required:true, help: mode==='up' ? 'At least 6 characters.' : '', ac: mode==='up' ? 'new-password' : 'current-password' })}
        <button class="btn primary" type="submit" style="width:100%">${mode==='in' ? 'Sign in' : 'Create password'}</button>
      </form>`, '', { keepFocus: true });
    document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    wireForm('#auth-form', {
      email: v => !v ? 'Enter your email.' : !/^\S+@\S+\.\S+$/.test(v) ? 'Enter a full email, like name@example.com.' : '',
      pw: v => !v ? 'Enter a password.' : (mode==='up' && v.length < 6) ? 'Use at least 6 characters.' : ''
    }, async vals => {
      if (!db) throw new Error('Couldn\'t reach the database. Check your connection and try again.');
      const email = vals.email.trim().toLowerCase();
      const res = mode === 'in'
        ? await db.auth.signInWithPassword({ email, password: vals.pw })
        : await db.auth.signUp({ email, password: vals.pw });
      if (res.error) throw new Error(authMsg(res.error));
      if (mode === 'up' && !res.data.session) throw new Error(authMsg({ message: 'Email not confirmed' }));
      closePanel(); toast('Signed in'); refreshAuth();
    });
  };
  draw();
}

/* ---------- panel ---------- */
let lastFocus = null;
function openPanel(title, body, foot, opts = {}) {
  if (!$('#panel').classList.contains('on')) lastFocus = document.activeElement;
  $('#panel-title').textContent = title;
  $('#panel-b').innerHTML = body;
  $('#panel-f').innerHTML = foot || '';
  $('#panel-f').style.display = foot ? '' : 'none';
  $('#panel').classList.add('on'); $('#scrim').classList.add('on');
  $('#panel-b').scrollTop = 0;
  const first = $('#panel').querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea');
  setTimeout(() => (first || $('#panel-x')).focus({ preventScroll: true }), 60);
}
function closePanel() {
  $('#panel').classList.remove('on'); $('#scrim').classList.remove('on');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
$('#panel-x').onclick = closePanel; $('#scrim').onclick = closePanel;
document.addEventListener('keydown', e => {
  const open = $('#panel').classList.contains('on');
  if (e.key === 'Escape' && open) { closePanel(); return; }
  if (open && e.key === 'Tab') {
    const f = [...$('#panel').querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled && x.offsetParent);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length-1]) { e.preventDefault(); f[0].focus(); }
  }
  if (!open && !e.metaKey && !e.ctrlKey && !e.altKey && !/input|select|textarea/i.test(document.activeElement.tagName)) {
    const map = { '1':'dashboard', '2':'cars', '3':'bikes', '4':'ledger', '5':'costs' };
    if (map[e.key]) location.hash = '#/' + map[e.key];
  }
});

/* ---------- forms ---------- */
function field(name, label, type, value, o = {}) {
  const id = 'f-' + name;
  let input;
  if (type === 'select') input = `<select id="${id}" name="${name}">${o.options.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(value ?? '') ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  else if (type === 'textarea') input = `<textarea id="${id}" name="${name}">${esc(value)}</textarea>`;
  else input = `<input id="${id}" name="${name}" type="${type}" value="${esc(value)}"${o.ac ? ` autocomplete="${o.ac}"` : ''}${o.step ? ` step="${o.step}"` : ''}${o.inputmode ? ` inputmode="${o.inputmode}"` : ''}${o.accept ? ` accept="${o.accept}"` : ''}${o.ph ? ` placeholder="${esc(o.ph)}"` : ''}>`;
  return `<div class="fld" data-f="${name}"><label for="${id}">${esc(label)}${o.required ? '' : ' <span class="hint">(optional)</span>'}</label>${input}${o.help ? `<span class="help">${esc(o.help)}</span>` : ''}<span class="err" id="${id}-err" aria-live="polite"></span></div>`;
}
function wireForm(sel, rules, onSubmit) {
  const form = $(sel); if (!form) return;
  const touched = new Set();
  const check = (name, show) => {
    const el = form.elements[name]; if (!el || !rules[name]) return '';
    const msg = rules[name](el.type === 'file' ? el.files : el.value, form);
    const box = form.querySelector(`[data-f="${name}"]`);
    if (show) { box.classList.toggle('bad', !!msg); box.querySelector('.err').textContent = msg; el.setAttribute('aria-invalid', msg ? 'true' : 'false'); }
    return msg;
  };
  form.addEventListener('input', e => { const n = e.target.name; if (!n) return; touched.add(n); const box = form.querySelector(`[data-f="${n}"]`); if (box && box.classList.contains('bad')) check(n, true); });
  form.addEventListener('focusout', e => { const n = e.target.name; if (n && touched.has(n)) check(n, true); });
  const submit = async e => {
    e.preventDefault();
    const bad = Object.keys(rules).filter(n => check(n, true));
    form.querySelector('.form-err')?.remove();
    if (bad.length) { form.elements[bad[0]].focus(); return; }
    const btns = [...document.querySelectorAll('#panel button[type=submit], #panel [data-submit]')];
    btns.forEach(b => b.disabled = true);
    try {
      const vals = Object.fromEntries([...form.elements].filter(x => x.name).map(x => [x.name, x.type === 'checkbox' ? x.checked : x.type === 'file' ? x.files : x.value]));
      await onSubmit(vals);
    } catch (err) {
      form.insertAdjacentHTML('afterbegin', `<div class="form-err" role="alert">${esc(err.message || err)}</div>`);
      $('#panel-b').scrollTop = 0;
    } finally { btns.forEach(b => b.disabled = false); }
  };
  form.addEventListener('submit', submit);
  document.querySelectorAll('#panel [data-submit]').forEach(b => b.onclick = () => form.requestSubmit());
}
const nz = v => (v === '' || v == null) ? null : v;
const nInt = v => (v === '' || v == null) ? null : parseInt(String(v).replace(/[^\d]/g, ''), 10);
const nMoney = v => (v === '' || v == null) ? null : parseFloat(String(v).replace(/[^\d.]/g, ''));
const intRule = (label) => v => v && !/^[\d,]+$/.test(v.trim()) ? `${label} should be a whole number, like 45,200.` : '';
const moneyRule = (label) => v => v && !/^\$?[\d,]*\.?\d{0,2}$/.test(v.trim()) ? `${label} should be an amount, like 1,250 or 1250.50.` : '';

/* ---------- uploads ---------- */
async function shrinkImage(file, max = 1800) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
  return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}
async function upload(file, prefix) {
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
  const path = `${prefix}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await db.storage.from('media').upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw new Error('The file didn\'t upload: ' + error.message + '. Try again, or save without it.');
  return db.storage.from('media').getPublicUrl(path).data.publicUrl;
}

/* ---------- views ---------- */
function photo(v, eager) {
  const mk = esc(((v.make || '?')[0] + ((v.model || '')[0] || '')).toUpperCase());
  return `<div class="ph">${v.photo_url ? `<img src="${esc(v.photo_url)}" alt="${esc(vname(v))}" ${eager ? '' : 'loading="lazy"'}>` : `<div class="mk" aria-hidden="true">${mk}</div>`}${v.status && v.status !== 'owned' ? `<span class="st chip light">${esc(STATUS[v.status])}</span>` : ''}</div>`;
}
function viewList(kind) {
  const list = S.vehicles.filter(v => v.kind === kind);
  const word = kind === 'car' ? 'car' : 'bike', Word = kind === 'car' ? 'Cars' : 'Bikes';
  const add = S.editor ? `<button class="btn primary" type="button" data-add-v="${kind}">${ICON.plus}Add ${word}</button>` : (S.user ? '' : lockNote());
  const totalPaid = addSums(...list.map(paid));
  let html = `<div class="head"><div><p class="eyebrow">The collection</p><h1>${Word}</h1>

/* ---------- charts ---------- */
const YEAR = new Date().getFullYear();
const KM_MI = 0.621371;
let distUnit = (() => { try { return localStorage.getItem('hc-unit') || 'mi'; } catch (e) { return 'mi'; } })();
const GF = { k: 'all' };
const conv = (o, u, to) => u === to ? o : to === 'mi' ? o * KM_MI : o / KM_MI;
function pointsFor(v) {
  const p = [];
  S.readings.filter(r => r.vehicle_id === v.id && r.date && r.odometer != null).forEach(r => p.push({ d: r.date, o: +r.odometer, u: r.unit }));
  recsFor(v.id).filter(r => r.date && r.mileage != null).forEach(r => p.push({ d: r.date, o: +r.mileage, u: v.odometer_unit }));
  if (v.odometer != null && v.odometer_date) p.push({ d: v.odometer_date, o: +v.odometer, u: v.odometer_unit });
  return p.sort((a, b) => a.d.localeCompare(b.d));
}
function hourPoints(v) {
  const p = S.readings.filter(r => r.vehicle_id === v.id && r.date && r.hours != null).map(r => ({ d: r.date, o: +r.hours }));
  recsFor(v.id).filter(r => r.date && r.hours != null).forEach(r => p.push({ d: r.date, o: +r.hours }));
  if (v.hours != null && v.odometer_date) p.push({ d: v.odometer_date, o: +v.hours });
  return p.sort((a, b) => a.d.localeCompare(b.d));
}
function drivenIn(v, year, to) {
  const y = String(year), p = pointsFor(v).map(x => ({ d: x.d, o: conv(x.o, x.u, to) }));
  const before = p.filter(x => x.d < y + '-01-01'), inY = p.filter(x => x.d.startsWith(y));
  if (!inY.length) return 0;
  const base = before.length ? before[before.length - 1].o : inY[0].o;
  return Math.max(0, Math.max(...inY.map(x => x.o)) - base);
}
const niceMax = v => { if (v <= 0) return 1; const e = 10 ** Math.floor(Math.log10(v)), m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; };
const short = n => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(Math.round(n));
const SYM = { BRL: 'R$', USD: 'US$' };
function chartCard(title, sub, viz, rows, tools = '') {

  return `<section class="cc"><div class="cc-h"><div><h3>${esc(title)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}</div><div class="tools">${tools}${tbl ? '<button class="btn sm" type="button" data-table aria-pressed="false">Table</button>' : ''}</div></div><div class="viz">${viz}</div>${tbl}</section>`;
}
function hbars(items, fmt) {

}
const LINES = {}; let lineN = 0;
function lineChart(pts, fmtY, unitLabel) {
  if (pts.length < 2) return `<p class="none">Log at least two readings to see a trend.</p>`;
  const t = pts.map(p => Date.parse(p.d)), t0 = Math.min(...t), t1 = Math.max(...t) || t0 + 1;
  let lo = Math.min(...pts.map(p => p.o)), hi = Math.max(...pts.map(p => p.o));
  const pad = (hi - lo) * .08 || 1; lo = Math.max(0, lo - pad); hi += pad;
  const X = ti => (t1 === t0 ? 50 : (ti - t0) / (t1 - t0) * 100), Y = o => 100 - (o - lo) / (hi - lo) * 100;
  const id = 'lc' + (++lineN);
  LINES[id] = pts.map((p, i) => ({ x: X(t[i]), y: Y(p.o), d: p.d, o: p.o }));
  const path = LINES[id].map(p => `${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' ');
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear();
  const xl = y0 === y1 ? [[0, fdate(pts[0].d), 'first'], [100, fdate(pts[pts.length - 1].d), 'last']] : [[0, y0, 'first'], [100, y1, 'last'], ...(y1 - y0 > 2 ? [[X(Date.parse(Math.round((y0 + y1) / 2) + '-01-01')), Math.round((y0 + y1) / 2), '']] : [])];
  return `<div class="lc" id="${id}" data-unit="${esc(unitLabel)}">
    ${[0, .5, 1].map(f => `<div class="g" style="top:calc(${f} * (100% - 24px))"><span>${fmtY(hi - (hi - lo) * f)}</span></div>`).join('')}
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${path}" fill="none" stroke="var(--fg)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>
    ${xl.map(([x, l, c]) => `<span class="xl ${c}" style="left:${x}%">${esc(l)}</span>`).join('')}
    <div class="xh"></div><div class="dot"></div><div class="hit"></div></div>`;
}
function wireLine(el) {
  const pts = LINES[el.id]; if (!pts) return;
  const hit = el.querySelector('.hit'), xh = el.querySelector('.xh'), dot = el.querySelector('.dot'), h = () => hit.getBoundingClientRect().height;
  const show = e => {
    const r = hit.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * 100;
    const p = pts.reduce((a, b) => Math.abs(b.x - fx) < Math.abs(a.x - fx) ? b : a);
    xh.style.left = p.x + '%'; xh.style.display = 'block';
    dot.style.left = p.x + '%'; dot.style.top = (p.y / 100 * h()) + 'px'; dot.style.display = 'block';
    showTip(`${fdate(p.d)}\n${(+p.o).toLocaleString('en-US')} ${el.dataset.unit}`, e.clientX, e.clientY);
  };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);

}
const tipEl = () => document.getElementById('tip');
function showTip(text, x, y) { const t = tipEl(); t.textContent = text; t.classList.add('on'); const w = t.offsetWidth, hh = t.offsetHeight; t.style.left = Math.min(innerWidth - w - 8, Math.max(8, x + 14)) + 'px'; t.style.top = Math.max(8, y - hh - 12) + 'px'; }

  const top = driven.slice(0, 8);
  const c1 = chartCard(`Most driven in ${YEAR}`, `Distance from logged readings, in ${distUnit === 'mi' ? 'miles' : 'kilometres'}`,
    top.length ? hbars(top.map(x => ({ label: vshort(x.v) + (x.v.colour && owned.filter(y => y.make === x.v.make && y.model === x.v.model).length > 1 ? ' ' + x.v.colour : ''), value: x.d, href: '#/vehicle/' + x.v.id, tip: `${vname(x.v)}\n${Math.round(x.d).toLocaleString('en-US')} ${distUnit} in ${YEAR}` })), v => Math.round(v).toLocaleString('en-US') + ' ' + distUnit) : `<p class="none">No readings logged in ${YEAR} yet. Use Log reading on a vehicle's page.</p>`,
    [['Vehicle', `Distance (${distUnit})`], ...driven.map(x => [vname(x.v), Math.round(x.d).toLocaleString('en-US')])], unitSeg);
  const years = Array.from({ length: 8 }, (_, i) => YEAR - 7 + i);
  const spendCards = ['BRL', 'USD'].filter(c => S.records.some(r => r.currency === c && +r.amount)).map(cur => {
    const items = spendByYear(S.records, cur, years);
    return chartCard(`Service spend by year (${SYM[cur]})`, `${years[0]}–${YEAR}, all vehicles`, vbars(items, n => SYM[cur] + short(n)), [['Year', `Spend (${SYM[cur]})`, 'Records'], ...items.map(i => [String(i.year), money(i.value, 0, cur), String(i.n)])]);
  });
  const dec = {}; owned.forEach(v => { const k = v.year ? Math.floor(v.year / 10) * 10 : 'Unknown'; (dec[k] = dec[k] || []).push(v); });
  const decKeys = Object.keys(dec).filter(k => k !== 'Unknown').map(Number).sort((a, b) => a - b);
  const decItems = decKeys.map(k => ({ label: `'${String(k).slice(2)}s`, full: `${k}s`, value: dec[k].length, tip: `${k}s: ${dec[k].length} vehicle${dec[k].length === 1 ? '' : 's'}\n${dec[k].map(vshort).join(', ')}` }));
  const c3 = chartCard('The collection by decade', `Model year${dec.Unknown ? ` · ${dec.Unknown.length} without a year not shown` : ''}`, vbars(decItems, n => String(Math.round(n))),
    [['Decade', 'Vehicles'], ...decItems.map(i => [i.full, String(i.value)]), ...(dec.Unknown ? [['Year unknown', String(dec.Unknown.length)]] : [])]);
  const now = Date.now();
  const lastSvc = v => recsFor(v.id).find(r => r.date && r.category !== 'other' && r.category !== 'registration')?.date;
  const att = owned.map(v => ({ v, d: lastSvc(v) })).filter(x => !x.d || now - Date.parse(x.d) > 365 * 864e5).sort((a, b) => (a.d || '').localeCompare(b.d || ''));
  const ago = d => { const m = Math.round((now - Date.parse(d)) / (30.44 * 864e5)); return m >= 24 ? `${Math.floor(m / 12)} years ago` : `${m} months ago`; };
  const c4 = `<section class="cc"><div class="cc-h"><div><h3>Needs attention</h3><p>${att.length} vehicle${att.length === 1 ? '' : 's'} with no service logged in the last 12 months</p></div></div>
    <div class="list">${att.slice(0, 8).map(x => `<a class="li" href="#/vehicle/${x.v.id}"><span style="min-width:0"><span class="t" style="display:block">${esc(vname(x.v))}</span><span class="m" style="display:block">${x.d ? 'Last service ' + fdate(x.d) : 'No service logged'}</span></span><span class="r">${x.d ? ago(x.d) : '—'}</span></a>`).join('') || '<p class="none">Everything has been serviced in the last year.</p>'}</div>
    ${att.length > 8 ? `<p class="hint" style="margin:12px 0 0">and ${att.length - 8} more</p>` : ''}</section>`;
  const recent = S.records.filter(r => r.date).slice(0, 6);
  const c5 = `<section class="cc"><div class="cc-h"><div><h3>Recent service</h3><p>Latest entries in the ledger</p></div><a class="btn sm" href="#/ledger">Ledger</a></div>
    <div class="list">${recent.map(r => `<a class="li" href="#/vehicle/${r.vehicle_id}"><span style="min-width:0"><span class="t" style="display:block">${esc(r.title)}</span><span class="m" style="display:block">${esc(vname(vById(r.vehicle_id)))} · ${fdate(r.date)}</span></span><span class="r">${r.amount != null ? money(r.amount, 0, r.currency) : '—'}</span></a>`).join('')}</div></section>`;
  return head + kpis + garage + `<div class="charts">${c1}${c3}${spendCards.join('')}${c4}${c5}</div>`;
}

/* ---------- readings ---------- */
function openReadingForm(v, r) {
  const isNew = !r;
  r = r || { date: new Date().toISOString().slice(0, 10), unit: v.odometer_unit || 'mi' };
  const dist = v.meter !== 'hours', hrs = v.meter !== 'distance';
  openPanel(isNew ? 'Log reading' : 'Edit reading', `
    <p class="hint" style="margin:0 0 18px">${esc(vname(v))}${v.odometer != null || v.hours != null ? ` · last recorded ${readingStr(v.odometer, v.odometer_unit, v.hours)}${v.odometer_date ? ' on ' + fdate(v.odometer_date) : ''}` : ''}</p>
    <form id="rd-form" novalidate>
      ${field('date', 'Date of reading', 'date', r.date, { required: true })}
      ${dist ? `<div class="two">${field('odometer', 'Odometer', 'text', r.odometer != null ? num(r.odometer) : '', { inputmode: 'numeric', required: !hrs })}${field('unit', 'Unit', 'select', r.unit, { required: true, options: [['mi', 'Miles'], ['km', 'Kilometres']] })}</div>` : ''}
      ${hrs ? field('hours', 'Engine hours', 'text', r.hours ?? '', { inputmode: 'decimal', required: !dist }) : ''}
      ${field('notes', 'Note', 'text', r.notes, { ph: 'Before track day, after trip…' })}
      ${!isNew ? `<fieldset style="margin-top:8px"><legend>Delete</legend><div id="del-box"><button class="btn danger" type="button" id="del-rd">Delete this reading…</button></div></fieldset>` : ''}
    </form>`,
    `<button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary" type="button" data-submit>${isNew ? 'Save reading' : 'Save changes'}</button>`);
  $('#cancel').onclick = closePanel;
  if (!isNew) $('#del-rd').onclick = () => {
    $('#del-box').innerHTML = `<div class="confirm"><p>Delete the reading of <b>${esc(readingStr(r.odometer, r.unit, r.hours))}</b>${r.date ? ' from ' + fdate(r.date) : ''}? This can't be undone.</p>
      <button class="btn" type="button" id="del-no">Keep it</button> <button class="btn danger solid" type="button" id="del-yes">Delete reading</button></div>`;
    $('#del-no').onclick = () => openReadingForm(v, r);
    $('#del-yes').onclick = async () => {
      const { error } = await db.from('odometer_readings').delete().eq('id', r.id);
      if (error) return toast('Couldn\'t delete: ' + error.message, true);
      S.readings = S.readings.filter(x => x.id !== r.id); closePanel(); toast('Reading deleted'); render();
    };
  };
  const rules = {
    date: x => !x ? 'Enter the date of the reading.' : x > new Date().toISOString().slice(0, 10) ? 'The date can\'t be in the future.' : '',
  };
  if (dist) rules.odometer = (x, f) => x && !/^[\d,]+$/.test(x.trim()) ? 'Odometer should be a whole number, like 62,950.' : (!x && (!hrs || !f.elements.hours.value)) ? 'Enter the odometer reading.' : '';
  if (hrs) rules.hours = (x, f) => x && !/^[\d,]*\.?\d?$/.test(x.trim()) ? 'Engine hours should be a number, like 123.5.' : (!x && (!dist || !f.elements.odometer.value)) ? 'Enter the engine hours.' : '';
  wireForm('#rd-form', rules, async f => {
    const row = { vehicle_id: v.id, date: f.date, odometer: dist ? nInt(f.odometer) : null, unit: dist ? f.unit : (v.odometer_unit || 'mi'), hours: hrs ? nMoney(f.hours) : null, notes: nz((f.notes || '').trim()) };
    const res = isNew ? await db.from('odometer_readings').insert(row).select().single() : await db.from('odometer_readings').update(row).eq('id', r.id).select().single();
    if (res.error) throw new Error('Couldn\'t save: ' + res.error.message);
    S.readings = (isNew ? [res.data, ...S.readings] : S.readings.map(x => x.id === r.id ? res.data : x)).sort((a, b) => (!a.date) - (!b.date) || (b.date || '').localeCompare(a.date || ''));
    // keep the vehicle's current reading in step when this is the newest one
    if (!v.odometer_date || row.date >= v.odometer_date) {
      const upd = { odometer_date: row.date };
      if (row.odometer != null) { upd.odometer = row.unit === v.odometer_unit ? row.odometer : Math.round(conv(row.odometer, row.unit, v.odometer_unit)); }
      if (row.hours != null) upd.hours = row.hours;
      const u = await db.from('vehicles').update(upd).eq('id', v.id).select().single();
      if (!u.error) S.vehicles = S.vehicles.map(x => x.id === v.id ? u.data : x);
    }
    closePanel(); toast(isNew ? 'Reading saved' : 'Saved'); render();
  });
}

/* ---------- router ---------- */
function current() { const h = location.hash.replace(/^#\/?/, '') || 'dashboard'; const [a, b] = h.split('/'); return { a, b }; }
function render() {
  const { a, b } = current();
  const tab = a === 'vehicle' ? (vById(b)?.kind === 'bike' ? 'bikes' : 'cars') : a;
  document.querySelectorAll('.tab').forEach(t => t.toggleAttribute('aria-current', false) || (t.dataset.r === tab && t.setAttribute('aria-current', 'page')));
  $('#n-cars').textContent = S.vehicles.filter(v => v.kind === 'car').length || '';
  $('#n-bikes').textContent = S.vehicles.filter(v => v.kind === 'bike').length || '';
  const banner = window.live.state === 'offline' ? `<div class="banner" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>Offline: ${esc(S.offline?.reason || 'the database couldn\'t be reached')}, so this is the copy saved${S.offline?.saved ? ' on ' + fdate(S.offline.saved) : ''}. Changes won't save until the connection is back. If you're on a work network, it may block the database; try your phone's data.</span><button class="btn sm" type="button" onclick="location.reload()">Try again</button></div>` : '';
  let html;
  if (a === 'dashboard') html = viewDashboard();
  else if (a === 'bikes') html = viewList('bike');
  else if (a === 'ledger') html = viewLedger();
  else if (a === 'costs') html = viewCosts();
  else if (a === 'vehicle') html = viewVehicle(b);
  else html = viewList('car');
  const titles = { dashboard: 'Dashboard', cars: 'Cars', bikes: 'Bikes', ledger: 'Service ledger', costs: 'Costs' };
  document.title = (a === 'vehicle' ? vname(vById(b)) : titles[a] || 'Dashboard') + ' · Home Collection';
  $('#view').innerHTML = banner + html;
  wireView();
}
function wireView() {
  const V = $('#view');
  V.querySelectorAll('[data-add-v]').forEach(b => b.onclick = () => openVehicleForm(null, b.dataset.addV));
  V.querySelectorAll('[data-edit-v]').forEach(b => b.onclick = () => openVehicleForm(vById(b.dataset.editV)));
  V.querySelectorAll('[data-add-r]').forEach(b => b.onclick = () => openRecordForm(null, b.dataset.addR));
  V.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => openRecord(S.records.find(r => r.id === b.dataset.rec)));
  V.querySelectorAll('[data-signin]').forEach(b => b.onclick = openAccount);
  V.querySelectorAll('[data-more-reads]').forEach(b => b.onclick = () => { readLimit[b.dataset.moreReads] = 1e9; render(); });
  V.querySelectorAll('[data-garage]').forEach(b => b.onclick = () => { GF.k = b.dataset.garage; render(); });
  V.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => { distUnit = b.dataset.unit; try { localStorage.setItem('hc-unit', distUnit); } catch (e) {} render(); });
  V.querySelectorAll('[data-table]').forEach(b => b.onclick = () => { const c = b.closest('.cc'); const on = c.classList.toggle('as-table'); b.setAttribute('aria-pressed', on); b.textContent = on ? 'Chart' : 'Table'; });
  V.querySelectorAll('[data-log]').forEach(b => b.onclick = () => openReadingForm(vById(b.dataset.log)));
  V.querySelectorAll('[data-read]').forEach(b => b.onclick = () => { const r = S.readings.find(x => x.id === b.dataset.read); openReadingForm(vById(r.vehicle_id), r); });
  V.querySelectorAll('.lc').forEach(wireLine);
  const keep = (id, k) => { const el = $(id); if (!el) return; el.oninput = el.onchange = () => { LF[k] = el.value; const pos = el.selectionStart; render(); const n = $(id); n.focus(); if (pos != null && n.setSelectionRange) n.setSelectionRange(pos, pos); }; };
  keep('#lf-q', 'q'); keep('#lf-v', 'v'); keep('#lf-c', 'c'); keep('#lf-y', 'y');
  const c = $('#lf-clear'); if (c) c.onclick = () => { Object.keys(LF).forEach(k => LF[k] = ''); render(); };
}
let lastRoute = '';
window.addEventListener('hashchange', () => {
  if ($('#panel').classList.contains('on')) closePanel();
  render();
  const r = current().a; if (r !== lastRoute) { window.scrollTo(0, 0); lastRoute = r; }
  $('#view').focus({ preventScroll: true });
});
$('#acct-btn').onclick = openAccount;

render();
load();
// Never call Supabase from inside onAuthStateChange: the library holds its auth lock while the
// callback runs, so a getSession() or query there waits on itself forever and every request stalls.
// Deferring with setTimeout lets the lock release first. (INITIAL_SESSION fires on subscribe.)
if (db) db.auth.onAuthStateChange((event, session) => { setTimeout(() => refreshAuth(session), 0); });
</script>
</body>
